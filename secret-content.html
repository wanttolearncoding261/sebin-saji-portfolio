<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Personal Vault | Sebin Saji</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
</head>
<body class="bg-zinc-950 text-white font-['Inter'] min-h-screen">
    <nav class="p-6 flex justify-between items-center border-b border-zinc-800">
        <div class="text-orange-500 font-bold uppercase tracking-widest">🔐 Personal Storage</div>
        <a href="index.html" class="text-xs text-gray-500 hover:text-white transition">Logout →</a>
    </nav>
    <main class="p-8 max-w-4xl mx-auto">
        <header class="mb-12">
            <h1 class="text-4xl font-black mb-2">My Private Archive</h1>
            <p class="text-gray-400">Modular storage system. Add new files in the script section.</p>
        </header>
        <div id="file-grid" class="grid grid-cols-1 md:grid-cols-2 gap-6"></div>
    </main>
    <script>
        // 🛠️ ADD YOUR FILES HERE
        const myFiles = [
            { name: "Project Presentation 1", path: "https://github.com/wanttolearncoding261/sebin-saji-portfolio/blob/main/pressentation/Betriebspraktikum%20Kindergarten%20Farbenland%20fah.pptx" },
            { name: "Hardware Specifications", path: "specs.pptx" },
            { name: "smthing", path: "my-photo.jpg" },
            { name: "Certification Scan", path: "cert.pdf" },
        ];

        function getFileIcon(path) {
            const ext = path.split('.').pop().toLowerCase();
            if (['jpg', 'jpeg', 'png', 'gif', 'webp'].includes(ext)) {
                return `<svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" /></svg>`;
            }
            if (['pptx', 'pdf', 'doc', 'docx', 'txt'].includes(ext)) {
                return `<svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 21h10a2 2 0 002-2V9.414a1 1 0 00-.293-.707l-5.414-5.414A1 1 0 0012.586 3H7a2 2 0 00-2 2v14a2 2 0 002 2z" /></svg>`;
            }
            return `<svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" /></svg>`;
        }

        function loadFiles() {
            const grid = document.getElementById('file-grid');
            grid.innerHTML = '';
            myFiles.forEach(file => {
                const card = document.createElement('div');
                card.className = "bg-zinc-900 p-6 rounded-2xl border border-zinc-800 hover:border-orange-500 transition group cursor-pointer";
                card.innerHTML = `
                    <div class="flex items-center gap-4">
                        <div class="p-3 bg-orange-500/10 rounded-lg text-orange-500">${getFileIcon(file.path)}</div>
                        <div class="flex-1">
                            <h3 class="font-bold group-hover:text-orange-500 transition">${file.name}</h3>
                            <p class="text-xs text-gray-500">${file.path.split('.').pop().toUpperCase()} File</p>
                        </div>
                        <a href="${file.path}" download class="bg-zinc-800 p-2 rounded-lg hover:bg-orange-500 hover:text-black transition">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" /></svg>
                        </a>
                    </div>`;
                grid.appendChild(card);
            });
        }
        window.onload = loadFiles;
    </script>
</body>
</html>
