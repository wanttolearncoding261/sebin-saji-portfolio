<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Vault | Restricted</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Fira Code', monospace; background-color: #000; }
        .glow-input { box-shadow: 0 0 15px rgba(255, 165, 0, 0.2); }
        .glow-input:focus { box-shadow: 0 0 25px rgba(255, 165, 0, 0.5); }
    </style>
</head>
<body class="h-screen flex items-center justify-center overflow-hidden">
    <div class="text-center z-10">
        <div class="mb-6 inline-block p-4 rounded-full bg-zinc-900 border border-orange-500">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-12 w-12 text-orange-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
            </svg>
        </div>
        <h1 class="text-2xl mb-2 text-white uppercase tracking-widest font-bold">Secure Vault</h1>
        <p class="text-gray-500 text-xs mb-8">Enter authorization key to proceed</p>
        <div class="relative mb-8">
            <input type="password" id="pin" maxlength="6"
                   class="glow-input bg-black border-2 border-zinc-800 text-orange-500 text-center text-4xl w-64 py-4 rounded-xl outline-none transition-all duration-300 focus:border-orange-500"
                   placeholder="••••••">
        </div>
        <button onclick="checkPin()" class="bg-orange-600 hover:bg-orange-500 text-black font-black px-10 py-3 rounded-full uppercase tracking-tighter transition-all duration-300 transform hover:scale-105">
            Unlock Access
        </button>
        <p id="error" class="text-red-500 mt-6 opacity-0 transition-opacity duration-300 font-bold">ACCESS DENIED: INVALID PIN</p>
    </div>
    <script>
        function checkPin() {
            const pin = document.getElementById('pin').value;
            const error = document.getElementById('error');
            if (pin === '197977') {
                document.body.style.backgroundColor = '#ffa500';
                setTimeout(() => { window.location.href = 'secret-content.html'; }, 300);
            } else {
                error.style.opacity = '1';
                document.getElementById('pin').value = '';
                setTimeout(() => { error.style.opacity = '0'; }, 2000);
            }
        }
        document.getElementById('pin').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') { checkPin(); }
        });
    </script>
</body>
</html>
